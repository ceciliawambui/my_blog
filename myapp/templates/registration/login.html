<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <div class="bg-white p-6 rounded shadow-md w-full max-w-sm">
        <h2 class="text-2xl font-bold text-center mb-6 text-gray-700">Login</h2>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div>
                <label for="id_username" class="block text-sm font-medium text-gray-600 mb-2">Username</label>
                <input type="text" name="username" id="id_username" 
                       class="border border-gray-300 rounded w-full p-2 focus:outline-none focus:ring focus:ring-blue-200"
                       required>
            </div>
            <div>
                <label for="id_password" class="block text-sm font-medium text-gray-600 mb-2">Password</label>
                <input type="password" name="password" id="id_password" 
                       class="border border-gray-300 rounded w-full p-2 focus:outline-none focus:ring focus:ring-blue-200"
                       required>
            </div>
            <button type="submit" 
                    class="w-full bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 focus:outline-none focus:ring focus:ring-blue-300">
                Login
            </button>
        </form>
        <div class="mt-4 text-sm text-center">
            <a href="{% url 'password_reset' %}" class="text-blue-500 hover:underline">Forgot Password?</a>
        </div>
    </div>
</body>
</html>
